<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameVault | Professional Edition</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>


<div id="landing" class="landing">
    <div class="landing-card">
        <h1 class="landing-title">GameLibrary Vault</h1>
        <p class="landing-sub">Sign in to access your private library.</p>

        <div class="tabs">
            <button id="tabLogin" class="tab active" type="button">Sign In</button>
            <button id="tabRegister" class="tab" type="button">Register</button>
        </div>

        <!-- LOGIN -->
        <div id="loginPanel">
            <input id="loginUsername" type="text" placeholder="Username" autocomplete="username" />
            <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password" />
            <button id="btnLogin" type="button" class="primary">Sign In</button>
        </div>

        <!-- REGISTER -->
        <div id="registerPanel" style="display:none;">
            <input id="regUsername" type="text" placeholder="Username" autocomplete="username" />
            <input id="regEmail" type="email" placeholder="Email" autocomplete="email" />
            <input id="regPassword" type="password" placeholder="Password" autocomplete="new-password" />
            <input id="regPassword2" type="password" placeholder="Confirm Password" autocomplete="new-password" />
            <button id="btnRegister" type="button" class="primary">Create Account</button>
        </div>

        <p id="authMessage" class="auth-message"></p>
    </div>
</div>


<div id="appSection" style="display:none;">
<div class="bg-glow"></div>


<div class="container-fluid px-5 py-4">
    <header class="row mb-5 align-items-center">
        <div class="col-md-4">
            <h1 class="logo">GAME<span class="text-neon">LIBRARY VAULT</span></h1>
            <p class="text-muted tracking-widest">ENCRYPTED LIBRARY ACCESS // 878 RECORDS</p>
        </div>
        <div class="col-md-8">
            <div class="row g-3">
                <div class="col-4">
                    <div class="stat-card">
                        <small>TOTAL VALUE</small>
                        <div class="value">€<span id="totalValue">0</span></div>
                    </div>
                </div>
                <div class="col-4">
                    <div class="stat-card">
                        <small>COMPLETION</small>
                        <div class="value">84%</div>
                    </div>
                </div>
                <div class="col-4">
                    <div class="stat-card highlight">
                        <button class="btn-import" onclick="document.getElementById('gameFile').click()">
                            INITIALIZE IMPORT
                        </button>
                        <input type="file" id="gameFile" hidden>
                    </div>
                </div>
                <button id="btnLogout" type="button" class="btn-logout">LOG OUT</button>
            </div>
        </div>
    </header>

    <div class="search-wrap mb-4">
        <input type="text" id="gameSearch" placeholder="SEARCH_DATABASE_...">
    </div>

    <div class="filters">
        <select id="filterPlatform">
            <option value="">All Platforms</option>
            <option>Steam</option>
            <option>Epic</option>
            <option>Xbox</option>
            <option>PlayStation</option>
            <option>Nintendo</option>
        </select>

        <select id="filterStatus">
            <option value="">All Status</option>
            <option>PLAYED</option>
            <option>NOT PLAYED</option>
            <option>COMPLETED</option>
        </select>

        <select id="sortBy">
            <option value="title">Sort: Title</option>
            <option value="priceDesc">Sort: Price (High → Low)</option>
            <option value="priceAsc">Sort: Price (Low → High)</option>
            <option value="hoursDesc">Sort: Playtime (High → Low)</option>
        </select>
    </div>


    <main id="gameGrid" class="poster-grid">
    </main>
</div>

<div id="gameModal" class="modal-backdrop" style="display:none;">
    <div class="modal-card">
        <button id="modalClose" class="modal-close">✕</button>

        <div class="modal-body">
            <div id="modalCover" class="modal-cover"></div>

            <div class="modal-details">
                <h2 id="modalTitle" class="modal-title"></h2>

                <div class="modal-grid">
                    <div><span class="label">Platform</span><span id="modalPlatform"></span></div>
                    <div><span class="label">Status</span><span id="modalStatus"></span></div>
                    <div><span class="label">Genre</span><span id="modalGenre"></span></div>
                    <div><span class="label">Playtime</span><span id="modalHours"></span></div>
                    <div><span class="label">Price</span><span id="modalPrice"></span></div>
                </div>
            </div>
        </div>
    </div>
</div>
</div>


<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="/js/app.js"></script>

</body>
</html>
