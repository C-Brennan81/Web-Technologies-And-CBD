<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PC Game Manager</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">Launcher Manager Dashboard</span>
    </div>
</nav>

<div class="container">
    <div class="card mb-4">
        <div class="card-header bg-primary text-white">Import Game Data</div>
        <div class="card-body">
            <form id="uploadForm">
                <div class="input-group">
                    <input type="file" class="form-control" id="gameFile" name="file" required>
                    <button class="btn btn-outline-primary" type="submit">Upload CSV</button>
                </div>
            </form>
            <div id="uploadStatus" class="mt-2"></div>
        </div>
    </div>

    <div class="card">
        <div class="card-header bg-secondary text-white">My Game Library</div>
        <div class="card-body">
            <table id="gamesTable" class="table table-striped table-bordered w-100">
                <thead>
                <tr>
                    <th>Title</th>
                    <th>Genre</th>
                    <th>Status</th>
                    <th>Launcher</th>
                    <th>Price</th>
                </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
